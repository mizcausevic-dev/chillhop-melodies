name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: write-all

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set topics and GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "topics"
            gh api -X PUT "repos/${{ github.repository }}/topics" \
              -f "names[]=midi" \
              -f "names[]=chillhop" \
              -f "names[]=melody" \
              -f "names[]=music-production" \
              -f "names[]=composition"
            echo "topics_exit:$?"
            echo "post"
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
            echo "post_exit:$?"
            echo "put"
            gh api -X PUT "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
            echo "put_exit:$?"
          } > pages-api-result.txt 2>&1
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add pages-api-result.txt
          git commit -m "Record Pages API result [skip ci]"
          git push
