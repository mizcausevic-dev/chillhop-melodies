name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Set topics and GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/topics" \
            -f "names[]=midi" \
            -f "names[]=chillhop" \
            -f "names[]=melody" \
            -f "names[]=music-production" \
            -f "names[]=composition" || true
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" \
            || gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
