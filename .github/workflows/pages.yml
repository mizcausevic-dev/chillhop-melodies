name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: write-all

jobs:
  enable:
    if: ${{ contains(github.event.head_commit.message, 'pages admin') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages with an available token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          {
            echo "admin_set:$([ -n \"$PAGES_ADMIN_TOKEN\" ] && echo yes || echo no)"
            echo "pat_set:$([ -n \"$GH_PAT\" ] && echo yes || echo no)"
            token="$GH_TOKEN"
            if [ -n "$PAGES_ADMIN_TOKEN" ]; then token="$PAGES_ADMIN_TOKEN"; echo "using admin"; fi
            if [ -z "$PAGES_ADMIN_TOKEN" ] && [ -n "$GH_PAT" ]; then token="$GH_PAT"; echo "using pat"; fi
            echo "post"
            GH_TOKEN="$token" gh api -X POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
            echo "post_exit:$?"
            echo "put"
            GH_TOKEN="$token" gh api -X PUT "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
            echo "put_exit:$?"
            echo "topics"
            GH_TOKEN="$token" gh api -X PUT "repos/${{ github.repository }}/topics" \
              -f "names[]=midi" \
              -f "names[]=chillhop" \
              -f "names[]=melody" \
              -f "names[]=music-production" \
              -f "names[]=composition"
            echo "topics_exit:$?"
          } > pages-api-result.txt 2>&1
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add pages-api-result.txt
          git commit -m "Record Pages API result [skip ci]"
          git push
