name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'pages admin') && !contains(github.event.head_commit.message, 'Deploy gh-pages') && !contains(github.event.head_commit.message, 'Measure pages') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the corrected pack
        run: |
          curl -fsSL -o /tmp/chillhop-fix.tar.gz "https://h.uguu.se/YVhCfHVK.tar.gz"
          echo "3f89273aaf3746bed70041c7ef46b770fc3971a2c88978a4f9f080cc37fc9b86  /tmp/chillhop-fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/chillhop-fix.tar.gz
          rm -f pages-api-result.txt source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tree unchanged"
          else
            git commit -m "Publish corrected Chillhop Melodies files [skip ci]"
            git push
          fi
          git push origin HEAD:gh-pages
